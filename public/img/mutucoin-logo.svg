<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Navy Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#143b6c" />
      <stop offset="60%" stop-color="#0b2242" />
      <stop offset="100%" stop-color="#061224" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#F5BA38" />
      <stop offset="70%" stop-color="#E29A16" />
      <stop offset="100%" stop-color="#BA7407" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Token Coin Ring -->
  <circle cx="500" cy="500" r="480" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Subtle Inner Accent Ring -->
  <circle cx="500" cy="500" r="445" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Centered & Scaled Mutual Monogram -->
  <g transform="translate(500, 500) scale(0.68) translate(-477.5, -437.5)" filter="url(#softGlow)">
    <!-- Left Slanted Bar -->
    <polygon points="360,0 0,558 140,558 431,119" fill="url(#goldGrad)" />

    <!-- Center Geometric Monogram -->
    <polygon points="611,7 269,533 485,874 705,535 604,376 533,481 566,536 486,658 404,535 680,116" fill="url(#goldGrad)" />

    <!-- Right Slanted Bar -->
    <polygon points="728,198 658,306 815,558 954,559" fill="url(#goldGrad)" />
  </g>
</svg>
