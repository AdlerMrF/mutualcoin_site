<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Versão animada de mutucoin-logo.svg (mesma arte). Entrada: o aro dourado se fecha,
       as três peças do monograma sobem em sequência e um brilho atravessa a moeda.
       Depois, o brilho repete a cada 9 s. Sem animação com movimento reduzido. -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#143b6c" />
      <stop offset="60%" stop-color="#0b2242" />
      <stop offset="100%" stop-color="#061224" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="30%" stop-color="#F5BA38" />
      <stop offset="70%" stop-color="#E29A16" />
      <stop offset="100%" stop-color="#BA7407" />
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0" />
      <stop offset=".5" stop-color="#FFF6D6" stop-opacity=".85" />
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="coin"><circle cx="500" cy="500" r="486" /></clipPath>
  </defs>
  <style>
    .ring { stroke-dasharray: 1; animation: close 1.1s cubic-bezier(.16,1,.3,1) both; transform-origin: 500px 500px; transform: rotate(-90deg); }
    .ring--in { animation-delay: .15s; }
    .piece { animation: rise .7s cubic-bezier(.16,1,.3,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
    .piece--l { animation-delay: .35s; }
    .piece--c { animation-delay: .45s; }
    .piece--r { animation-delay: .55s; }
    .sheen { transform: translateX(-1400px) skewX(-18deg); animation: sheen 9s cubic-bezier(.45,0,.2,1) 1s infinite; }
    @keyframes close { from { stroke-dashoffset: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(60px) scale(.92); } }
    @keyframes sheen {
      0% { transform: translateX(-1400px) skewX(-18deg); }
      14%, 100% { transform: translateX(1400px) skewX(-18deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring, .piece, .sheen { animation: none; }
      .sheen { display: none; }
    }
  </style>

  <circle cx="500" cy="500" r="480" fill="url(#bgGrad)" />
  <circle class="ring" pathLength="1" cx="500" cy="500" r="480" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <circle class="ring ring--in" pathLength="1" cx="500" cy="500" r="445" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <g transform="translate(500, 500) scale(0.68) translate(-477.5, -437.5)" filter="url(#softGlow)">
    <polygon class="piece piece--l" points="360,0 0,558 140,558 431,119" fill="url(#goldGrad)" />
    <polygon class="piece piece--c" points="611,7 269,533 485,874 705,535 604,376 533,481 566,536 486,658 404,535 680,116" fill="url(#goldGrad)" />
    <polygon class="piece piece--r" points="728,198 658,306 815,558 954,559" fill="url(#goldGrad)" />
  </g>

  <g clip-path="url(#coin)" style="mix-blend-mode:soft-light">
    <rect class="sheen" x="380" y="-200" width="240" height="1400" fill="url(#sheenGrad)" />
  </g>
</svg>
